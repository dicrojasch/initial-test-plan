name: CI & Security Scan (Self-Hosted)

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: [self-hosted, Linux, ARM64]
    defaults:
      run:
        working-directory: demo-ci-pipeline

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python virtual environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Linter (Ruff)
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Run Tests (Pytest)
        run: |
          . .venv/bin/activate
          pytest

  semgrep-sast:
    name: Security Scan (Semgrep)
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run Semgrep via Local Docker
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan --config=auto --error
